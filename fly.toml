# fly.toml app configuration file generated for trackpractice on 2023-08-12T09:05:50-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "trackpractice"
primary_region = "iad"
console_command = "/rails/bin/rails console"

[build]

# No release_command: Fly runs it on a throwaway machine without the volume,
# so db:prepare happens in bin/docker-entrypoint on the real machine instead.

[mounts]
  source = "data"
  destination = "/rails/storage"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[statics]]
  guest_path = "/rails/public"
  url_prefix = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
