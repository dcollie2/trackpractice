# SQLite everywhere. In production the file lives on the Fly volume mounted at
# /rails/storage, so it survives deploys and is covered by volume snapshots.
#
# The production entry uses the `url:` key on purpose: Rails lets an explicit
# url in database.yml win over ENV["DATABASE_URL"], which still points at the
# old Postgres cluster until the one-time import is done.
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  url: sqlite3:storage/production.sqlite3
